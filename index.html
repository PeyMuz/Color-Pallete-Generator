<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Pallete Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
      <h1>COLOR PALLETE GENERATOR</h1>
       <button id="generate-btn">
        <i class="fas fa-sync alt"></i>
        Generate Pallete
       </button>

       <div class="palette-container">

        <!--Color Box 1-->
        <div class="color-box">
            <div class="color" style="background-color: #e1f5fe;"></div>
            <div class="color-info">
             <span class="hex-value">#E1F5FE</span>
             <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
            </div>
        </div>
        <!--Color Box 2-->
        <div class="color-box">
            <div class="color" style="background-color: #3498DB;"></div>
            <div class="color-info">
             <span class="hex-value">#3498DB</span>
             <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
            </div>
        </div>

        <!--Color Box 3-->
        <div class="color-box">
            <div class="color" style="background-color: #2ECC71;"></div>
            <div class="color-info">
             <span class="hex-value">#2ECC71</span>
             <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
            </div>
        </div>

        <!--Color Box 4-->
        <div class="color-box">
            <div class="color" style="background-color: #E74C3C;"></div>
            <div class="color-info">
             <span class="hex-value">#E74C3C</span>
             <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
            </div>
        </div>

        <!--Color Box 5-->
        <div class="color-box">
            <div class="color" style="background-color: #9B59B6;"></div>
            <div class="color-info">
             <span class="hex-value">#9B59B6</span>
             <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
            </div>
        </div>


       </div>

    </div>


</body>
    <script scr="index.js"></script>
</html>
